version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sda_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deadline_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./codebase/data/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
